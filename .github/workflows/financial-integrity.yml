name: Financial integrity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install backend
        run: pip install -r backend/requirements.txt pytest==8.4.2 httpx==0.28.1

      - name: Financial integrity
        # Blocks staging/prod Pages deploys. Includes Only-this-occurrence amount-edit
        # regressions that fail if a recurring edit leaves old + new amounts on one date.
        run: python -m pytest backend/tests/test_financial_integrity.py -q
