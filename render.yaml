# Render Blueprint: production + staging stacks.
# https://render.com/docs/blueprint-spec
#
# Production API (branch main): set DATABASE_URL, JWT_SECRET, CORS_ORIGINS, ENV=production
# in the dashboard — do not reuse production DATABASE_URL for staging.
#
# Staging (branch staging): Neon staging branch + API + static frontend. See docs/STAGING.md.
# The trial-reminder cron is staging-only. It reuses this Docker image and does not
# run against production. Set its DATABASE_URL to the staging Neon host, and set
# RESEND_API_KEY plus the same STAGING_AUTH_EMAIL_ALLOWLIST as the staging API.
# DATABASE_URL on family-cash-flow-api-staging must be the Neon staging endpoint
# (ep-polished-boat-…), never production (ep-ancient-union-…).
#
# Host labels below must match the real Neon endpoints wired in Render:
#   production API → ep-ancient-union-…
#   staging API    → ep-polished-boat-…

services:
  - type: web
    name: family-cash-flow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    branch: main
    healthCheckPath: /docs

  - type: web
    name: family-cash-flow-api-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    branch: staging
    healthCheckPath: /docs
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PRODUCTION_DATABASE_HOST
        value: ep-ancient-union-and21kx9-pooler
      - key: STAGING_DATABASE_HOST
        value: ep-polished-boat-ando6x8y-pooler
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_PUBLIC_BASE_URL
        sync: false
      - key: STAGING_AUTH_EMAIL_ALLOWLIST
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: family-cash-flow-trial-reminders-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    branch: staging
    schedule: "15 14,20 * * *"
    dockerCommand: python -m app.trial_ending_reminders
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TRIAL_ENDING_REMINDERS_ENABLED
        value: "1"
      - key: PRODUCTION_DATABASE_HOST
        value: ep-ancient-union-and21kx9-pooler
      - key: STAGING_DATABASE_HOST
        value: ep-polished-boat-ando6x8y-pooler
      - key: APP_PUBLIC_BASE_URL
        value: https://staging.balancewhiz.com
      - key: CORS_ORIGINS
        value: https://staging.balancewhiz.com
      - key: STAGING_AUTH_EMAIL_ALLOWLIST
        sync: false

  - type: web
    name: family-cash-flow-web-staging
    runtime: static
    branch: staging
    buildCommand: chmod +x scripts/build-frontend-static.sh && ./scripts/build-frontend-static.sh public-staging
    staticPublishPath: public-staging
    envVars:
      - key: API_BASE
        sync: false

databases:
  - name: family-cash-flow-db-staging
    databaseName: family_cash_flow_staging
    plan: free
